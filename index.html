<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Valentine 💘</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    ›
    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    button {
      padding: 12px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
    }
    #yes {
      background: #ff4d6d;
      color: white;
    }
    #no {
      background: #ccc;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Faisal, will you be my Valentine? 💘</h2>
    <button id="yes">YES 💖</button>
    <button id="no">No 🙃</button>
    <p id="msg"></p>
  </div>

  <script>
    let size = 16;
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");

    noBtn.onclick = () => {
      size += 8;
      yesBtn.style.fontSize = size + "px";
      msg.innerText = "Are you sureee? 😭";
    };

    yesBtn.onclick = () => {
      document.body.innerHTML = "<h1 style='color:white'>YAY 💖 You’re my Valentine 😌</h1>";
    };
  </script>

</body>
</html>
